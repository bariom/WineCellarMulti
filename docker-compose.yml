services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: winecellarmulti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env. Run ./setup-env.sh}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d winecellarmulti"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: WineCellarMulti
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env. Run ./setup-env.sh}@postgres:5432/winecellarmulti
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env. Run ./setup-env.sh}
      SESSION_COOKIE_NAME: winecellarmulti_session
      SESSION_COOKIE_SECURE: "false"
      SESSION_TTL_DAYS: "30"
      INVITE_TTL_DAYS: "7"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
