services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: winecellarmulti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env. Run ./setup-env.sh}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d winecellarmulti"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: Vinaris
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env. Run ./setup-env.sh}@postgres:5432/winecellarmulti
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env. Run ./setup-env.sh}
      SESSION_COOKIE_NAME: winecellarmulti_session
      SESSION_COOKIE_SECURE: "true"
      SESSION_TTL_DAYS: "30"
      INVITE_TTL_DAYS: "7"
      TRIAL_ENTITLEMENT_DAYS: "5"
      CORS_ORIGINS: https://vinaris.app,https://www.vinaris.app,https://vinaris.duckdns.org,https://winecellarmulti.duckdns.org,http://localhost:5173,http://127.0.0.1:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-5.5}
      OPENAI_ECONOMY_MODEL: ${OPENAI_ECONOMY_MODEL:-gpt-5.6-luna}
      OPENAI_BALANCED_MODEL: ${OPENAI_BALANCED_MODEL:-gpt-5.6-terra}
      OPENAI_ADVANCED_MODEL: ${OPENAI_ADVANCED_MODEL:-gpt-5.6-sol}
      OPENAI_ENABLE_GPT56: ${OPENAI_ENABLE_GPT56:-false}
      OPENAI_ENABLE_MODEL_ROUTING: ${OPENAI_ENABLE_MODEL_ROUTING:-false}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-gpt-5.5}
      OPENAI_LEGACY_REASONING_EFFORT: ${OPENAI_LEGACY_REASONING_EFFORT:-low}
      OPENAI_ECONOMY_REASONING_EFFORT: ${OPENAI_ECONOMY_REASONING_EFFORT:-low}
      OPENAI_BALANCED_REASONING_EFFORT: ${OPENAI_BALANCED_REASONING_EFFORT:-medium}
      OPENAI_ADVANCED_REASONING_EFFORT: ${OPENAI_ADVANCED_REASONING_EFFORT:-high}
      OPENAI_LEGACY_MAX_OUTPUT_TOKENS: ${OPENAI_LEGACY_MAX_OUTPUT_TOKENS:-0}
      OPENAI_ECONOMY_MAX_OUTPUT_TOKENS: ${OPENAI_ECONOMY_MAX_OUTPUT_TOKENS:-0}
      OPENAI_BALANCED_MAX_OUTPUT_TOKENS: ${OPENAI_BALANCED_MAX_OUTPUT_TOKENS:-0}
      OPENAI_ADVANCED_MAX_OUTPUT_TOKENS: ${OPENAI_ADVANCED_MAX_OUTPUT_TOKENS:-0}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-0}
      OPENAI_WEB_SEARCH_TOOL_COST_USD: ${OPENAI_WEB_SEARCH_TOOL_COST_USD:-0.01}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
