services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: winecellarmulti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d winecellarmulti"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
