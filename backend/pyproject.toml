[project]
name = "winecellarmulti-backend"
version = "0.1.0"
description = "Multi-user backend for WineCellarMulti"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.20",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "psutil>=6.1.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "webauthn>=2.7.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pre-commit>=4.0.0",
  "pyright>=1.1.390",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["wine_catalog.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/prompts/library.py" = ["E501"]
"app/api/routes/*.py" = ["B008", "E501"]

[tool.pyright]
include = ["app"]
exclude = [".venv", "alembic"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
