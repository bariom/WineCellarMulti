server {
    listen 80;
    listen [::]:80;
    server_name vinaris.app www.vinaris.app;

    location / {
        return 301 https://vinaris.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vinaris.app www.vinaris.app;
    client_max_body_size 25M;

    ssl_certificate /etc/ssl/vinaris/fullchain.pem;
    ssl_certificate_key /etc/ssl/vinaris/vinaris.app-PrivateKey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /home/administrator/progetti/WineCellarMulti/frontend/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer-when-downgrade;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name vinaris.duckdns.org;

    location / {
        return 301 https://vinaris.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vinaris.duckdns.org;
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/vinaris.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinaris.duckdns.org/privkey.pem;

    location / {
        return 301 https://vinaris.app$request_uri;
    }
}
