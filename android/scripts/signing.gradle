// Secrets are supplied at build time and never written into generated sources.
def releaseStore = System.getenv('VINARIS_ANDROID_KEYSTORE')
if (releaseStore) {
    android {
        signingConfigs {
            vinarisRelease {
                storeFile file(releaseStore)
                storePassword System.getenv('VINARIS_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('VINARIS_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('VINARIS_ANDROID_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.vinarisRelease
            }
        }
    }
}
